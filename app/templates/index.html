<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        const room_id = "{{ room_id }}";
        const token = "{{ token }}";
        let username = "{{ username }}";  // Переменная для хранения имени пользователя

        // Извлечение имени пользователя из токена (например, если оно в поле 'username')
        try {
            const decoded = jwt.decode(token);  // Используйте библиотеку jwt, чтобы декодировать токен
            username = decoded.username;  // Извлекаем имя пользователя из токена
        } catch (error) {
            console.error("Ошибка декодирования токена:", error);
        }

    </script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-container { max-width: 600px; margin: 0 auto; }
        #messages { list-style-type: none; padding: 0; }
        #messages li { padding: 5px 10px; border-bottom: 1px solid #ddd; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Чат-комната: {{ room_id }} AND {{ token }}</h2>

        <ul id="messages"></ul>

        <input type="text" id="message" placeholder="Введите сообщение">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const socket = io();

        // Подключение к комнате
        socket.emit('join', { room: room_id });

        // Получение сообщений
        socket.on('receive_message', function(data) {
            const messages = document.getElementById('messages');
            const li = document.createElement('li');
            li.textContent = `${data.username}: ${data.message}`;
            messages.appendChild(li);
        });

        // Обработка ошибок
        socket.on('error', function(data) {
            alert(data.msg);
        });

        // Отправка сообщения
        function sendMessage() {
            const message = document.getElementById('message').value;

            if (username && message) {
                socket.emit('send_message', {
                    username: username,
                    message: message,
                    room: room_id
                });
                document.getElementById('message').value = '';
            } else {
                alert('Ошибка: имя пользователя или сообщение отсутствует!');
            }
        }
    </script>
</body>
</html>
